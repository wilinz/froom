name: froom
description: >
  The typesafe, reactive, and lightweight SQLite abstraction for your Flutter applications.
  This library is the runtime dependency.
version: 7.0.0
homepage: https://wilinz.github.io/froom/
repository: https://github.com/wilinz/froom
documentation: https://wilinz.github.io/froom
issue_tracker: https://github.com/wilinz/froom/issues

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  collection: ^1.19.1
  froom_annotation:
    path: ../froom_annotation/
  froom_common:
    path: ../froom_common/
  meta: ^1.16.0
  sqflite_common: ^2.5.13
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  build_runner: ^2.8.0
  froom_generator:
    path: ../froom_generator
  matcher: ^0.12.17
  path: ^1.9.1
  test: ^1.26.3

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

# the encryption tests use SQLite3MultipleCiphers, which doesn't affect apps
# depending on this package
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
