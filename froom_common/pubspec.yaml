name: froom_common
description: >
  The typesafe, reactive, and lightweight SQLite abstraction for your Flutter applications.
  This library is the runtime dependency.
version: 8.0.0
homepage: https://wilinz.github.io/froom/
repository: https://github.com/wilinz/froom
documentation: https://wilinz.github.io/froom
issue_tracker: https://github.com/wilinz/froom/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
#  froom_annotation: ^2.0.0
  froom_annotation:
    path: ../froom_annotation/
  meta: ^1.16.0
  path: ^1.9.1
  sqflite_common: ^2.5.6
  sqlparser: ^0.45.1

dev_dependencies:
  build_runner: ^2.8.0
  collection: ^1.19.1
#  froom_generator: ^2.0.0
  froom_generator:
    path: ../froom_generator/
  sqflite_common_ffi: ^2.4.5
  test: ^1.26.3
  matcher: ^0.12.17
  mockito: ^5.5.0

# the bundled SQLite of package:sqlite3 lacks FTS3 and FTS4, which the
# integration tests use
hooks:
  user_defines:
    sqlite3:
      source: system
      name:
        windows: winsqlite3
