name: example
description: >
  The typesafe, reactive and lightweight SQLite abstraction for your Flutter applications.
  This is an example on how to use the library.
version: 1.0.0
homepage: https://wilinz.github.io/froom/
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  froom:
    path: ../froom/
  flutter:
    sdk: flutter
  sqflite: ^2.4.5 # the database factory of Android and iOS

dev_dependencies:
  build_runner: ^2.7.0
  froom_generator:
    path: ../froom_generator/
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
