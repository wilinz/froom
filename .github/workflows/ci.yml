name: CI

on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  froom-annotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: dart:3.9.0

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: froom_annotation
        run: dart pub get

      - name: Analyze
        working-directory: froom_annotation
        run: dart analyze --no-fatal-warnings .

      # - name: Format
      #   working-directory: froom_annotation
      #   run: dart format --output=none --set-exit-if-changed .

  froom-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # the lowest SDK of dart_style versions supporting analyzer 11
    container:
      image: dart:3.10.0

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: froom_generator
        run: dart pub get

      - name: Analyze
        working-directory: froom_generator
        run: dart analyze --no-fatal-warnings .

      # - name: Format
      #   working-directory: froom_generator
      #   run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        working-directory: froom_generator
        run: dart run test_cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: froom_generator
          files: ./froom_generator/coverage/lcov.info

  froom:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # the integration tests of froom_common use the system SQLite for FTS3
      # and FTS4, see its pubspec.yaml
      - name: Install SQLite
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install sqlite3 libsqlite3-dev

      - name: Install dependencies
        run: |
          dart pub get --directory froom_common
          dart pub get --directory froom
          dart pub get --directory froom_ffi

      - name: Run generator
        run: |
          cd froom_common && dart run build_runner build --delete-conflicting-outputs
          cd ../froom && dart run build_runner build --delete-conflicting-outputs
          cd ../froom_ffi && dart run build_runner build --delete-conflicting-outputs
        shell: bash

      - name: Analyze froom_common
        run: dart analyze --no-fatal-warnings .
        working-directory: froom_common

      - name: Analyze froom
        run: dart analyze --no-fatal-warnings .
        working-directory: froom

      - name: Analyze froom_ffi
        run: dart analyze --no-fatal-warnings .
        working-directory: froom_ffi

      - name: Run tests
        run: flutter test --coverage --coverage-path coverage/lcov.info
        working-directory: froom_common

      # with SQLite3MultipleCiphers, see the pubspec.yaml of froom
      - name: Run encryption tests
        run: dart test
        working-directory: froom

      - name: Run froom_ffi tests
        run: dart test
        working-directory: froom_ffi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: froom
          files: ./froom_common/coverage/lcov.info

  froom-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: dart pub get
        working-directory: froom

      - name: Run generator
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: froom

      - name: Set up SQLite for the web
        run: dart run sqflite_common_ffi_web:setup --dir test/web
        working-directory: froom

      - name: Run tests compiled to JavaScript
        run: dart test -p chrome test/web
        working-directory: froom

      - name: Run tests compiled to WebAssembly
        run: dart test -p chrome --compiler dart2wasm test/web
        working-directory: froom

  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: example

      - name: Check generated code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
        working-directory: example

      - name: Analyze
        run: flutter analyze --no-fatal-warnings .
        working-directory: example

      - name: Run tests
        run: flutter test
        working-directory: example

      - name: Build for the web
        run: |
          dart run sqflite_common_ffi_web:setup
          flutter build web
        working-directory: example
